name: Atualizar métricas do perfil

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-metrics.yml'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verificar o painel e o conteúdo
        run: node --test scripts/render-activity.test.mjs
      - name: Consultar GitHub e gerar o painel
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/update-metrics.mjs
      - name: Salvar métricas atualizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-isometric.svg assets/activity-isometric-mobile.svg data/activity.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração nas métricas.'
            exit 0
          fi
          git commit -m 'chore: atualizar métricas públicas do perfil'
          git push
